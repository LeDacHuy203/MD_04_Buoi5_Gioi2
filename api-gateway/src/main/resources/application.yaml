server:
  port: 8080

spring:
  application:
    name: Api_Gateway
  cloud:
    gateway:
      # Cách 1 (Toàn cục): Áp dụng AddResponseHeader cho mọi response đi qua Gateway
      default-filters:
        - AddResponseHeader=X-System-Name, Api-Gateway-System
      routes:
        - id: customer-service-route
          uri: lb://CustomerService
          predicates:
            - Path=/api/v1/auth/**, /api/v1/customers/**
          # Hoặc Cách 1 (Theo route): Áp dụng cho riêng route này
          filters:
            - AddResponseHeader=X-System-Name, Api-Gateway-System

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
